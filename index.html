<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0d">
<title>Private Bank 網銀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: single-column phone banking app, max 440px, fixed bottom tab bar. Deliberately dark-only: a black-card bank. */
:root {
  --ink: #0b0b0d;          /* page */
  --panel: #151518;        /* raised surfaces */
  --line: #26262b;         /* hairlines */
  --text: #ecebe6;         /* primary text */
  --muted: #8d8b85;        /* secondary text */
  --gold: #c9b17e;         /* champagne accent */
  --plus: #9fd0a8;         /* credit */
  --minus: #e4a199;        /* debit */
  --f-display: "Bodoni Moda", "Times New Roman", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--ink); color: var(--text); margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 440px; margin: 0 auto; padding-inline: 18px; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 22px; }

/* Header */
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; }
.mono { width: 34px; height: 34px; border: 1px solid var(--gold); border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); color: var(--gold); font-size: 17px; }
.brand-name { font-family: var(--f-display); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
.bell { font-size: 12px; color: var(--muted); letter-spacing: .08em; }
.hello { display: flex; flex-direction: column; gap: 2px; }
.hello small { color: var(--muted); font-size: 13px; }
.hello h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; }

/* Card */
.card-wrap { perspective: 900px; }
.card { position: relative; aspect-ratio: 1.586; max-width: 100%; border-radius: 16px; padding: 20px 22px; overflow: hidden;
  background: radial-gradient(120% 140% at 0% 0%, #2c2c31 0%, #121214 45%, #050506 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 24px 48px -18px rgba(0,0,0,.9);
  transform-style: preserve-3d; transition: transform .25s ease-out; display: flex; flex-direction: column; justify-content: space-between; }
.card::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(90deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
.card::after { content: ""; position: absolute; inset: -40%; pointer-events: none;
  background: linear-gradient(115deg, transparent 40%, rgba(255,240,210,.13) 50%, transparent 60%);
  transform: translateX(var(--shine, -30%)); transition: transform .25s ease-out; }
.card-row { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.card-tier { font-size: 10px; letter-spacing: .3em; color: var(--muted); text-transform: uppercase; }
.card-j { font-family: var(--f-display); font-size: 40px; line-height: 1; color: var(--gold); }
.chip { width: 38px; height: 28px; border-radius: 6px; background: linear-gradient(135deg, #d9c597, #8e7a4f); position: relative; }
.chip::after { content: ""; position: absolute; inset: 6px 8px; border: 1px solid rgba(0,0,0,.25); border-radius: 3px; }
.nfc { width: 18px; height: 18px; color: var(--muted); }
.card-no { font-family: var(--f-mono); font-size: 15px; letter-spacing: .14em; position: relative; z-index: 1; }
.card-holder { font-size: 11px; letter-spacing: .22em; color: var(--muted); text-transform: uppercase; }

/* Balance */
.balance { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
.balance > div { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.label { font-size: 11px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.big { font-family: var(--f-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--f-body); font-size: 12px; color: var(--muted); margin-left: 4px; }

/* Two accounts: real fund + love points */
.accts { display: flex; flex-direction: column; gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
.acct { background: var(--panel); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.acct-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.acct .sub { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.acct .sub b { color: var(--text); font-weight: 400; font-family: var(--f-mono); }
.cur { font-family: var(--f-body); font-size: 13px; color: var(--muted); margin-right: 4px; }
.split { display: flex; height: 4px; border-radius: 2px; overflow: hidden; background: var(--line); }
.split i { display: block; height: 100%; }
.split .c { background: var(--gold); } .split .s { background: var(--plus); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; margin-left: 6px; }
.fresh { font-size: 11px; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.seg button { padding: 8px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--text); }
.month { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.month > div { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.month .amt { font-size: 17px; }

/* Quick actions */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick button { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding-block: 4px; }
.quick .ico { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--gold); font-size: 18px; background: var(--panel); }

/* Sections */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; }
.sec-head h2 { margin: 0; font-size: 16px; font-weight: 500; }
.sec-head button { font-size: 13px; color: var(--gold); }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; padding-block: 13px; border-bottom: 1px solid var(--line); }
.row .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .meta b { font-weight: 500; }
.row .meta span { font-size: 12px; color: var(--muted); }
.amt { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.amt.plus { color: var(--plus); } .amt.minus { color: var(--minus); }

/* Perks */
.perks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.perk { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color .2s; }
.perk:hover { border-color: var(--gold); }
.perk .em { font-size: 22px; }
.perk b { font-weight: 500; font-size: 14px; line-height: 1.35; }
.perk .cost { font-family: var(--f-mono); font-size: 13px; color: var(--gold); margin-top: auto; }
.perk[disabled] { opacity: .45; cursor: not-allowed; }

/* Vouchers */
.pill { font-size: 11px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--gold); color: var(--gold); white-space: nowrap; }
.pill.used { border-color: var(--line); color: var(--muted); }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: rgba(11,11,13,.92); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 8px 18px calc(8px + env(safe-area-inset-bottom, 0px)); }
.tabs nav { max-width: 440px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }

/* 收支分析 */
.seg3 { grid-template-columns: repeat(3, 1fr); }
.sum3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border-radius: 12px; overflow: hidden; }
.sum3 > div { background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sum3 .amt { font-size: 15px; }
.bars { display: flex; flex-direction: column; gap: 12px; }
.bar-row { display: flex; flex-direction: column; gap: 5px; }
.bar-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.bar-top span:last-child { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-top small { color: var(--muted); margin-left: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.bar.out i { background: var(--minus); } .bar.in i { background: var(--plus); }
.trend { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-items: end; height: 120px; padding-top: 8px; }
.trend .col { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.trend .pair { display: flex; gap: 3px; align-items: flex-end; height: 100%; }
.trend .pair i { width: 9px; border-radius: 2px 2px 0 0; min-height: 2px; }
.trend .pair .in { background: var(--plus); } .trend .pair .out { background: var(--minus); }
.trend .col span { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
.tabs button { padding: 8px 0; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button .t-ico { font-size: 17px; }
.tabs button[aria-current="page"] { color: var(--gold); }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 440px; background: var(--panel); border-radius: 20px 20px 0 0; border-top: 1px solid var(--line);
  padding: 22px 20px calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 16px; max-height: 88vh; overflow-y: auto;
  animation: up .28s ease-out; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
.sheet h3 { margin: 0; font-size: 18px; font-weight: 500; }
.sheet p { margin: 0; color: var(--muted); }
.btn { padding: 13px 16px; border-radius: 12px; font-weight: 500; text-align: center; }
.btn.pri { background: var(--gold); color: var(--ink); }
.btn.ghost { border: 1px solid var(--line); }
.btn.danger { border: 1px solid var(--minus); color: var(--minus); }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kv { display: flex; justify-content: space-between; padding-block: 8px; border-bottom: 1px solid var(--line); font-size: 14px; }
.kv span:first-child { color: var(--muted); }
.row-btn { width: 100%; text-align: left; cursor: pointer; }
.row-btn:hover .meta b { color: var(--gold); }
.clip { font-size: 12px; margin-left: 6px; }
.gallery { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin-inline: -4px; padding: 4px; }
.shot { flex: 0 0 100%; margin: 0; scroll-snap-align: center; min-height: 200px; display: grid; place-items: center; background: var(--ink); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.shot img { width: 100%; max-height: 62vh; object-fit: contain; display: block; }
.ticket { border: 1px dashed var(--gold); border-radius: 14px; padding: 18px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
.ticket .code { font-family: var(--f-mono); font-size: 26px; letter-spacing: .2em; color: var(--gold); }
input { width: 100%; background: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 12px; color: var(--text); font: inherit; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }

/* Opening ceremony */
.intro { position: fixed; inset: 0; z-index: 30; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 24px; text-align: center; }
.intro .card { width: min(320px, 100%); animation: deal 1.1s cubic-bezier(.2,.8,.2,1); }
@keyframes deal { from { transform: translateY(60px) rotateX(50deg); opacity: 0; } }
.intro h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 28px; }
.intro p { margin: 0; color: var(--muted); max-width: 30ch; }
.house-logo { width: 210px; max-width: 75%; height: auto; overflow: visible; }
.toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 40; background: var(--text); color: var(--ink); padding: 10px 16px; border-radius: 99px; font-size: 14px; }
.empty { color: var(--muted); font-size: 13px; padding-block: 12px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app"></div>
<div class="tabs"><nav id="tabs">
  <button data-tab="home" aria-current="page"><span class="t-ico">◈</span>首頁</button>
  <button data-tab="perks"><span class="t-ico">✦</span>權益兌換</button>
  <button data-tab="history"><span class="t-ico">≡</span>交易紀錄</button>
  <button data-tab="stats"><span class="t-ico">◔</span>收支分析</button>
</nav></div>

<script>
/* ===== 改這裡就好 ===== */
const CONFIG = {
  bankName: "Alex Private Bank",
  mono: "A",                       // 卡面字母
  customer: "嘟嘟",                 // 首頁稱呼
  holderEn: "MY ONLY CUSTOMER",     // 卡面持卡人
  cardNo: "5208 •••• •••• 1314",
  since: "2026/10/05",              // 開戶日
  openingBonus: 5201314,            // 開戶禮點數（改這裡，已開戶的手機也會自動補差額）
  limitText: "無上限",
  pin: "0802",                      // 行員後台密碼（連點左上 logo 5 下）
  perks: [
    { id: "dish",    em: "🍽️", title: "免洗碗一次",           cost: 520 },
    { id: "drink",   em: "🧋", title: "手搖飲外送到府",         cost: 199 },
    { id: "bfast",   em: "🥐", title: "早餐送到床邊",           cost: 520 },
    { id: "massage", em: "💆", title: "全身按摩 30 分鐘",       cost: 999 },
    { id: "photo",   em: "📷", title: "專屬攝影師一日",         cost: 1200 },
    { id: "dinner",  em: "🥂", title: "指定晚餐，我請客",       cost: 1314 },
    { id: "shop",    em: "🛍️", title: "陪逛街一整天不催",       cost: 1500 },
    { id: "peace",   em: "🕊️", title: "無條件和好券",           cost: 2000 },
    { id: "boss",    em: "👑", title: "今天妳說了算",           cost: 3000 },
    { id: "gift",    em: "🎁", title: "神秘驚喜禮物一份",       cost: 5200 },
  ],
};
/* ===================== */

const KEY = "private_bank_v1";
const now = () => new Date().toISOString();
function fresh() {
  return { opened: false, balance: CONFIG.openingBonus,
    txns: [{ id: "t0", at: now(), title: "生日開戶禮", note: "歡迎成為本行唯一客戶", amount: CONFIG.openingBonus }],
    vouchers: [] };
}
let storageOk = true;
function load() {
  try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : fresh(); }
  catch (e) { storageOk = false; return fresh(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
let state = load();
// 開戶禮改過金額：已開戶的手機補上差額，兌換紀錄不受影響
{
  const t0 = state.txns.find(t => t.id === "t0");
  if (t0 && t0.amount !== CONFIG.openingBonus) {
    state.balance += CONFIG.openingBonus - t0.amount;
    t0.amount = CONFIG.openingBonus;
    save();
  }
}
let tab = "home";

const $ = (s, el = document) => el.querySelector(s);
const fmt = n => n.toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
const dt = iso => { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const code = () => Array.from({ length: 6 }, () => "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");

const cardHTML = () => `
  <div class="card" id="card">
    <div class="card-row"><span class="card-tier">Infinite · Private</span><span class="card-j">${esc(CONFIG.mono)}</span></div>
    <div class="card-row" style="align-items:center"><span class="chip"></span>
      <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 6c2 3.5 2 8.5 0 12"/><path d="M12 4c3 4.5 3 11.5 0 16"/><path d="M16 2c4 5.5 4 14.5 0 20"/></svg></div>
    <div class="card-row" style="flex-direction:column;gap:6px">
      <span class="card-no">${esc(CONFIG.cardNo)}</span>
      <span class="card-holder">${esc(CONFIG.holderEn)} · since ${esc(CONFIG.since)}</span>
    </div>
  </div>`;

const txnRow = t => `<div class="row"><div class="meta"><b>${esc(t.title)}</b><span>${dt(t.at)}${t.note ? " · " + esc(t.note) : ""}</span></div>
  <span class="amt ${t.amount >= 0 ? "plus" : "minus"}">${t.amount >= 0 ? "+" : "−"}${fmt(Math.abs(t.amount))}</span></div>`;

const voucherRow = v => `<div class="row"><div class="meta"><b>${esc(v.title)}</b><span>憑證 ${v.code} · ${dt(v.at)}</span></div>
  <span class="pill ${v.used ? "used" : ""}">${v.used ? "已使用" : "可使用"}</span></div>`;

function renderHome() {
  const unused = state.vouchers.filter(v => !v.used);
  return `
  <header class="top"><button class="brand" id="logo" aria-label="${esc(CONFIG.bankName)}"><span class="mono">${esc(CONFIG.mono)}</span><span class="brand-name">${esc(CONFIG.bankName)}</span></button>
    <button class="bell" id="logout" aria-label="登出網銀">登出</button></header>
  <div class="hello"><h1>HI ${esc(CONFIG.customer)}~</h1></div>
  <div class="card-wrap">${cardHTML()}</div>
  <div class="accts">
    <div class="acct">${fundSummary()}</div>
    <div class="acct">
      <div class="acct-top"><span class="label">寵愛點數</span><span class="fresh">額度 ${esc(CONFIG.limitText)}</span></div>
      <span class="big">${fmt(state.balance)}<small>pts</small></span>
    </div>
  </div>
  <div class="quick">
    <button data-go="perks"><span class="ico">✦</span>兌換權益</button>
    <button data-go="history"><span class="ico">≡</span>交易紀錄</button>
    <button id="q-vouch"><span class="ico">◇</span>我的憑證</button>
    <button id="q-cs"><span class="ico">☏</span>專屬理專</button>
  </div>
  <section class="sec"><div class="sec-head"><h2>可使用的憑證</h2>${unused.length ? `<span class="label">${unused.length} 張</span>` : ""}</div>
    <div class="list">${unused.length ? unused.slice(0, 3).map(voucherRow).join("") : `<div class="empty">還沒有兌換任何權益。到「權益兌換」挑一個吧。</div>`}</div></section>
  ${fundSection()}
  <section class="sec"><div class="sec-head"><h2>最近點數交易</h2><button data-go="history" data-hist="points">查看全部</button></div>
    <div class="list">${state.txns.slice(0, 3).map(txnRow).join("")}</div></section>`;
}

/* ===== 真實帳戶（Notion ❤️❤️基金） ===== */
let FUND = null, fundErr = false;
const ntd = n => `<span class="cur">NT$</span>${fmt(Math.round(n))}`;
const day = s => s.replaceAll("-", "/");
function fundSummary() {
  if (!FUND) return `<div class="acct-top"><span class="label">❤️❤️基金・總資產</span></div>
    <span class="fresh">${fundErr ? "基金資料暫時讀不到，等等再打開看看。" : "正在讀取基金資料…"}</span>`;
  const c = FUND.cash.balance, s = FUND.stockValue, t = c + s;
  return `<div class="acct-top"><span class="label">${esc(FUND.fundName)}・總資產</span><span class="fresh">更新於 ${dt(FUND.updatedAt)}</span></div>
    <span class="big">${ntd(t)}</span>

/* ===== 交易圖片：img/*.enc 用同一把金鑰加密（前 12 bytes 是 IV），點開才下載解密 ===== */
let CUR_KEY = null;
async function loadImage(path) {
  const r = await fetch(path, { cache: "force-cache" });
  if (!r.ok) throw new Error("img");
  const buf = new Uint8Array(await r.arrayBuffer());
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, CUR_KEY, buf.slice(12));
  return URL.createObjectURL(new Blob([pt], { type: "image/jpeg" }));
}
function showImages(t) {
  const urls = [];
  const s = sheet(`<h3>${esc(t.title)}</h3>
    <p>${day(t.date)}・<span class="amt ${t.amount >= 0 ? "plus" : "minus"}">${t.amount >= 0 ? "+" : "−"}${fmt(Math.abs(t.amount))}</span></p>
    <div class="gallery">${t.imgs.map((_, i) => `<figure class="shot" data-i="${i}"><span class="fresh">圖片解密中…</span></figure>`).join("")}</div>
    ${t.imgs.length > 1 ? `<span class="fresh" style="text-align:center">左右滑動看 ${t.imgs.length} 張</span>` : ""}
    <button class="btn ghost" data-close>關閉</button>`);
  t.imgs.forEach(async (p, i) => {
    const fig = s.querySelector(`.shot[data-i="${i}"]`);
    try { const u = await loadImage(p); urls.push(u); fig.innerHTML = `<img src="${u}" alt="${esc(t.title)} 第 ${i + 1} 張">`; }
    catch (e) { fig.innerHTML = `<span class="fresh">這張圖片讀不到，等下次同步再試。</span>`; }
  });
  new MutationObserver((_, o) => { if (!s.isConnected) { urls.forEach(URL.revokeObjectURL); o.disconnect(); } }).observe(document.body, { childList: true });
}
/* ===== 密碼鎖：data.enc.json 用 PBKDF2 + AES-GCM 加密，密碼錯就解不開 ===== */
const KEY_STORE = "private_bank_key";
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = u8 => btoa(String.fromCharCode(...u8));
let ENC = null;
async function fetchEnc() {
  const r = await fetch("data.enc.json", { cache: "no-store" });
  if (!r.ok) throw new Error("no data");
  return r.json();
}
async function decryptWith(key) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ENC.iv) }, key, unb64(ENC.ct));
  CUR_KEY = key;
  return JSON.parse(new TextDecoder().decode(pt));
}
async function keyFromPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: unb64(ENC.salt), iterations: ENC.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function rememberedKey() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY_STORE) || "null");
    if (!s || s.salt !== ENC.salt) return null;
    return crypto.subtle.importKey("raw", unb64(s.raw), "AES-GCM", false, ["decrypt"]);
  } catch (e) { return null; }
}
async function remember(key) {
  try { localStorage.setItem(KEY_STORE, JSON.stringify({ salt: ENC.salt, raw: tob64(new Uint8Array(await crypto.subtle.exportKey("raw", key))) })); } catch (e) {}
}
function unlocked(data) {
  FUND = data; $("#lock")?.remove(); render();
  if (storageOk && !state.opened) intro();
}

}

/* ===== 收支分析：依分類統計 ❤️❤️基金的收入與支出 ===== */
let statRange = "last";
const RANGES = { last: "上個月", "6m": "近 6 個月", all: "全部" };
// 往回推 n 個月的 "YYYY-MM" 清單，結尾是 endKey
function monthKeys(endKey, n) {
  const [y, m] = endKey.split("-").map(Number);
  return Array.from({ length: n }, (_, i) => {
    const d = new Date(Date.UTC(y, m - 1 - (n - 1 - i), 1));
    return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}`;
  });
}
function aggregate(byMonth, keys, kind) {
  const out = {};
  for (const k of keys) for (const [tag, v] of Object.entries(byMonth[k]?.[kind] ?? {})) out[tag] = (out[tag] ?? 0) + v;
  return Object.entries(out).sort((a, b) => b[1] - a[1]);
}
function barList(rows, cls) {
  if (!rows.length) return `<div class="empty">這段期間沒有紀錄。</div>`;
  const total = rows.reduce((s, r) => s + r[1], 0), max = rows[0][1];
  return `<div class="bars">${rows.map(([tag, v]) => `
    <div class="bar-row"><div class="bar-top"><span>${esc(tag)}<small>${Math.round(v / total * 100)}%</small></span><span>${fmt(Math.round(v))}</span></div>
    <div class="bar ${cls}"><i style="width:${v / max * 100}%"></i></div></div>`).join("")}</div>`;
}
function renderStats() {
  const seg = `<div class="seg seg3" role="group" aria-label="期間">${Object.entries(RANGES).map(([k, l]) =>
    `<button data-range="${k}" aria-pressed="${statRange === k}">${l}</button>`).join("")}</div>`;
  const head = `<div class="hello"><small>${FUND ? esc(FUND.fundName) + "・同步自 Notion" : "Notion"}</small><h1>收支分析</h1></div>`;
  const bm = FUND?.stats?.byMonth;
  if (!bm) return `${head}<div class="empty">${FUND ? "分析資料還沒同步，明天早上 9 點後就會出現。" : "正在讀取…"}</div>`;

  const lastKey = FUND.month.label.replace("/", "-");
  const keys = statRange === "last" ? [lastKey] : statRange === "6m" ? monthKeys(lastKey, 6) : Object.keys(bm).sort();
  const inc = aggregate(bm, keys, "income"), exp = aggregate(bm, keys, "expense");
  const ti = inc.reduce((s, r) => s + r[1], 0), te = exp.reduce((s, r) => s + r[1], 0), net = ti - te;
  const label = statRange === "last" ? FUND.month.label : statRange === "6m" ? `${day(keys[0])} – ${day(lastKey)}` : "開戶至今";

  const tk = monthKeys(lastKey, 6);
  const tv = tk.map(k => ({ k, i: Object.values(bm[k]?.income ?? {}).reduce((a, b) => a + b, 0), o: Object.values(bm[k]?.expense ?? {}).reduce((a, b) => a + b, 0) }));
  const tmax = Math.max(1, ...tv.flatMap(x => [x.i, x.o]));

  return `${head}${seg}
  <span class="fresh">${esc(label)}</span>
  <div class="sum3">
    <div><span class="label">收入</span><span class="amt plus">+${fmt(Math.round(ti))}</span></div>
    <div><span class="label">支出</span><span class="amt minus">−${fmt(Math.round(te))}</span></div>
    <div><span class="label">結餘</span><span class="amt ${net >= 0 ? "plus" : "minus"}">${net >= 0 ? "+" : "−"}${fmt(Math.round(Math.abs(net)))}</span></div>
  </div>
  <section class="sec"><div class="sec-head"><h2>支出分類</h2><span class="label">${exp.length} 類</span></div>${barList(exp, "out")}</section>
  <section class="sec"><div class="sec-head"><h2>收入分類</h2><span class="label">${inc.length} 類</span></div>${barList(inc, "in")}</section>
  <section class="sec"><div class="sec-head"><h2>近 6 個月趨勢</h2>
    <div class="legend"><span><i style="background:var(--plus)"></i>收入</span><span><i style="background:var(--minus)"></i>支出</span></div></div>
    <div class="trend" role="img" aria-label="近 6 個月收入與支出">${tv.map(x => `
      <div class="col"><div class="pair"><i class="in" style="height:${x.i / tmax * 100}%" title="收入 ${fmt(Math.round(x.i))}"></i><i class="out" style="height:${x.o / tmax * 100}%" title="支出 ${fmt(Math.round(x.o))}"></i></div>
      <span>${Number(x.k.slice(5))}月</span></div>`).join("")}</div></section>`;
}

function bindCardTilt() {
  const c = $("#card"); if (!c || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const move = (x, y) => { const r = c.getBoundingClientRect(); const px = (x - r.left) / r.width - .5, py = (y - r.top) / r.height - .5;
    c.style.transform = `rotateY(${px * 14}deg) rotateX(${-py * 14}deg)`; c.style.setProperty("--shine", `${px * 60}%`); };
  c.addEventListener("pointermove", e => move(e.clientX, e.clientY));
  c.addEventListener("pointerleave", () => { c.style.transform = ""; c.style.setProperty("--shine", "-30%"); });
}

}

  if (t.dataset.range) { statRange = t.dataset.range; render(); return; }
  if (t.dataset.txn) { showImages(FUND.txns[Number(t.dataset.txn)]); return; }
  if (t.id === "logout") { try { localStorage.removeItem(KEY_STORE); } catch (_) {} location.reload(); return; }
  if (t.dataset.hist) { hist = t.dataset.hist; if (!t.dataset.go) { render(); return; } }
  if (t.dataset.tab) go(t.dataset.tab);
  else if (t.dataset.go) go(t.dataset.go);
  else if (t.dataset.perk) redeem(CONFIG.perks.find(p => p.id === t.dataset.perk));
  else if (t.id === "logo") logoTap();
  else if (t.id === "q-vouch") { hist = "points"; go("history"); }
  else if (t.id === "q-cs") sheet(`<h3>專屬理專</h3><p>本行理專 24 小時待命，回覆速度視理專是否在打電動而定。</p>
    <div class="kv"><span>服務時間</span><span>全年無休</span></div><div class="kv"><span>服務態度</span><span>永遠五星</span></div>
    <button class="btn pri" data-close>好的</button>`);
});

render();
boot();
</script>
